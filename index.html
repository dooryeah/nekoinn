    <!-- 内容区 -->

    <div id="copyToast" class="copy-toast" role="status" aria-live="polite"></div>

    <!-- 脚本 -->
    <script src="js/avatar-sources.js?v=20260722-littleskin"></script>
    <script src="js/supabase-config.js?v=20260618-local-opt"></script>
    <script>
        let siteQuotesCache = null;
        let lastQuoteText = "";

        function copyQQ(event) {
            const qq = "1082948381";
            const button = event && event.currentTarget ? event.currentTarget : null;
            const showCopied = () => {
                showCopyToast("已复制 QQ 审核群号：" + qq);
                markCopyButton(button);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(qq).then(showCopied).catch(() => fallbackCopy(qq, button));
            } else {
                fallbackCopy(qq, button);
            }
        }

        function fallbackCopy(text, button) {
            const input = document.createElement("input");
            input.value = text;
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            input.remove();
            showCopyToast("已复制 QQ 审核群号：" + text);
            markCopyButton(button);
        }

        function markCopyButton(button) {
            if (!button) return;
            if (!button.dataset.copyLabel) {
                button.dataset.copyLabel = button.textContent.trim();
            }
            button.textContent = "已复制";
            button.classList.add("is-copied");
            clearTimeout(button.copyResetTimer);
            button.copyResetTimer = setTimeout(() => {
                button.textContent = button.dataset.copyLabel;
                button.classList.remove("is-copied");
            }, 1600);
        }

        function showCopyToast(message) {
            const toast = document.getElementById("copyToast");
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(window.copyToastTimer);
            window.copyToastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
        }

        document.querySelectorAll("[data-copy-qq]").forEach(button => {
            button.addEventListener("click", copyQQ);
        });

        function formatQuote(quote) {
            const text = String(quote && (quote.quote_text || quote.text) || "").trim();
            const author = String(quote && (quote.author_name || quote.author) || "").trim();
            if (!text) return "";
            return author ? "「" + text + "」—— " + author : "「" + text + "」";
        }

        async function loadSiteQuotes() {
            if (siteQuotesCache) return siteQuotesCache;

            const config = window.NEKOINN_SUPABASE || {};
            const url = String(config.url || "").replace(/\/$/, "");
            const anonKey = String(config.anonKey || "");
            if (!url || !anonKey) {
                siteQuotesCache = [];
                return siteQuotesCache;
            }

            try {
                const endpoint = url + "/rest/v1/site_quotes?select=quote_text,author_name&is_active=eq.true&order=created_at.desc&limit=80";
                const response = await fetch(endpoint, {
                    headers: {
                        apikey: anonKey,
                        Authorization: "Bearer " + anonKey,
                    },
                });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const remoteQuotes = await response.json();
                siteQuotesCache = Array.isArray(remoteQuotes) ? remoteQuotes : [];
            } catch (error) {
                siteQuotesCache = [];
            }
            return siteQuotesCache;
        }

        async function showRandomQuote() {
            const quoteEl = document.getElementById("uptimeQuote");
            const trigger = document.getElementById("uptimeQuoteTrigger");
            if (!quoteEl || !trigger) return;

            const quotes = (await loadSiteQuotes())
                .map(quote => ({ raw: quote, text: formatQuote(quote) }))
                .filter(item => item.text);
            if (!quotes.length) {
                quoteEl.textContent = "还没有留言被收录喵";
                quoteEl.hidden = false;
                trigger.setAttribute("aria-expanded", "true");
                quoteEl.classList.remove("show");
                requestAnimationFrame(() => quoteEl.classList.add("show"));
                return;
            }

            let picked = quotes[Math.floor(Math.random() * quotes.length)];
            if (quotes.length > 1) {
                let guard = 0;
                while (picked.text === lastQuoteText && guard < 6) {
                    picked = quotes[Math.floor(Math.random() * quotes.length)];
                    guard += 1;
                }
            }

            lastQuoteText = picked.text;
            quoteEl.textContent = picked.text;
            quoteEl.hidden = false;
            trigger.setAttribute("aria-expanded", "true");
            quoteEl.classList.remove("show");
            requestAnimationFrame(() => quoteEl.classList.add("show"));
        }

        const uptimeQuoteTrigger = document.getElementById("uptimeQuoteTrigger");
        if (uptimeQuoteTrigger) {
            uptimeQuoteTrigger.addEventListener("click", showRandomQuote);
        }

        // 服务器运行时间计时器
        const SERVER_START = new Date("2026-02-14T00:00:00");

        function updateUptime() {
            const now = new Date();
            let diff = Math.floor((now - SERVER_START) / 1000);
            if (diff < 0) diff = 0;

            const days = Math.floor(diff / 86400);
            const hours = Math.floor((diff % 86400) / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;

            document.getElementById("uptimeDays").textContent = days;
            document.getElementById("uptimeHours").textContent = String(hours).padStart(2, "0");
            document.getElementById("uptimeMinutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("uptimeSeconds").textContent = String(seconds).padStart(2, "0");
        }

        updateUptime();
        setInterval(updateUptime, 1000);

    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/animations.js?v=20260618-local-opt"></script>

    <script>
        (function () {
            const FALLBACK_MEMBERS = [
                "Akari_desu", "mengnai123", "Dooryeah730", "YuriRina", "huazai111",
                "ninesuncwc", "everynum", "TheQuietStarry", "Serein2K", "CYHsama",
                "un_vagrant", "JIANFFN", "Tling777", "Tek1t_", "YGDAY",
                "yangyang_xl", "xiaoluoawa", "Harutoki", "WYT_1314", "bro_Yummy",
                "lindilinlin", "mcxmy", "Meukr", "NFnifeng", "erzhanggui520",
                "LKAS", "workdaybasezz", "chuan_gu", "Jim_chim", "Rion",
                "SBrecord", "Geopelia_39", "BaiYi_", "msmht", "daddytony",
                "givewhyyyy",
            ];

            const grid = document.getElementById("playerGrid");

            function bindCard(card, playerName) {
                if (!playerName) return;
                card.tabIndex = 0;
                card.setAttribute("role", "link");
                card.setAttribute("aria-label", "查看 " + playerName + " 的成员资料");
                card.addEventListener("click", () => {
                    window.location.href = "profile.html?player=" + encodeURIComponent(playerName);
                });
                card.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        window.location.href = "profile.html?player=" + encodeURIComponent(playerName);
                    }
                });
                card.addEventListener("mousemove", (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -15;
                    const rotateY = ((x - centerX) / centerX) * 15;
                    card.style.transform = "perspective(800px) translateY(-10px) rotateX(" + rotateX + "deg) rotateY(" + rotateY + "deg)";
                });
                card.addEventListener("mouseleave", () => {
                    card.style.transform = "perspective(800px) translateY(0px) rotateX(0deg) rotateY(0deg)";
                });
            }

            function renderMembers(members) {
                if (!grid) return;
                grid.innerHTML = "";
                members.forEach((member) => {
                    const name = String(member.minecraft_name || member.name || "").trim();
                    if (!name) return;

                    const card = document.createElement("div");
                    card.className = "player-avatar-card";

                    const img = document.createElement("img");
                    img.alt = name + " 的 Minecraft 头像";
                    img.width = 96;
                    img.height = 96;
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.src = "./images/logo.png";

                    const label = document.createElement("p");
                    label.textContent = name;

                    card.appendChild(img);
                    card.appendChild(label);
                    bindCard(card, name);

                    if (window.NekoinnAvatars) {
                        window.NekoinnAvatars.apply(img, name, member.avatar_url || "");
                    } else {
                        img.src = "https://mc-heads.net/avatar/" + encodeURIComponent(name);
                    }

                    grid.appendChild(card);
                });
            }

            function renderFallback() {
                const names = FALLBACK_MEMBERS.slice().sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
                renderMembers(names.map((name) => ({ minecraft_name: name, avatar_url: "" })));
            }

            async function loadRemoteMembers() {
                const config = window.NEKOINN_SUPABASE || {};
                const url = String(config.url || "").replace(/\/$/, "");
                const anonKey = String(config.anonKey || "");
                if (!url || !anonKey) return;

                try {
                    const response = await fetch(url + "/rest/v1/rpc/get_public_members", {
                        method: "POST",
                        headers: {
                            apikey: anonKey,
                            Authorization: "Bearer " + anonKey,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({}),
                    });
                    if (!response.ok) return;
                    const remote = await response.json();
                    if (Array.isArray(remote) && remote.length) {
                        renderMembers(remote);
                    }
                } catch (error) {
                    // 拉取失败时保留静态兜底数据
                }
            }

            renderFallback();
            loadRemoteMembers();
        })();
    </script>
