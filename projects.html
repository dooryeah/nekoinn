    function toPlainText(text) {
    return String(text || "")
    .replace(/<br\s*\/?>/gi, " ")
    .replace(/<[^>]*>/g, "")
    .replace(/\s+/g, " ")
    .trim();
    }

    function escapeHtml(value) {
    return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
    }

    function formatDescription(text) {
    return String(text || "")
    .split(/<br\s*\/?>/gi)
    .map(part => escapeHtml(part.trim()))
    .filter(Boolean)
    .join("<br>");
    }

    function getProjectList() {
    return filteredProjects.length ? filteredProjects : PROJECTS;
    }

    function renderProjects() {
    const grid = document.getElementById("projectGrid");
    const count = document.getElementById("projectCount");
    if (!grid) return;
    if (window.NekoinnMotion) window.NekoinnMotion.cleanupRevealTargets(grid);
    grid.innerHTML = "";

    filteredProjects = PROJECTS.filter(p => {
    const dimOk = filters.dimension === "all" || p.dimension === filters.dimension;
    const typeOk = filters.type === "all" || p.type === filters.type;
    const haystack = [p.name, p.author, p.dimension, p.type, toPlainText(p.description)].join(" ").toLowerCase();
    const queryOk = !filters.query || haystack.includes(filters.query);
    return dimOk && typeOk && queryOk;
    });

    if (count) {
    count.textContent = `显示 ${filteredProjects.length} / ${PROJECTS.length} 个项目`;
    }

    if (filteredProjects.length === 0) {
    grid.innerHTML = '<div class="no-result">暂无匹配的项目 🐱</div>';
    requestAnimationFrame(() => {
    if (window.NekoinnMotion) window.NekoinnMotion.refresh();
    else if (window.ScrollTrigger) ScrollTrigger.refresh();
    });
    return;
    }

    filteredProjects.forEach((project, index) => {
    const card = document.createElement("button");
    card.className = "project-card fade-up";
    card.type = "button";
    card.addEventListener("click", () => showProjectModal(index));

    card.innerHTML = `
    <span class="project-image-wrap">
    <img src="${escapeHtml(project.image)}" alt="${escapeHtml(project.name)}" loading="lazy" onerror="this.src='./images/logo.png'">
    <span class="project-zoom-label">查看大图</span>
    </span>
    <div class="project-info">
    <div class="project-name">${escapeHtml(project.name)}</div>
    <p class="project-author">建造者：${escapeHtml(project.author)}</p>
    <p class="project-desc">${escapeHtml(toPlainText(project.description) || "暂无描述喵")}</p>
    <div class="project-tags">
    <span class="ptag">${escapeHtml(project.dimension)}</span>
    <span class="ptag">${escapeHtml(project.type)}</span>
    </div>
    </div>
    `;
    grid.appendChild(card);
    });

    requestAnimationFrame(() => {
    if (window.NekoinnMotion) window.NekoinnMotion.refresh();
    else if (window.ScrollTrigger) ScrollTrigger.refresh();
    });
    }

    document.querySelectorAll(".filter-tag").forEach(tag => {
    tag.addEventListener("click", () => {
    const group = tag.dataset.group;
    const value = tag.dataset.value;

    document.querySelectorAll(`.filter-tag[data-group="${group}"]`).forEach(t => t.classList.remove("active"));
    tag.classList.add("active");

    filters[group] = value;
    renderProjects();
    });
    });

    const searchInput = document.getElementById("projectSearch");
    if (searchInput) {
    searchInput.addEventListener("input", () => {
    filters.query = searchInput.value.trim().toLowerCase();
    renderProjects();
    });
    }

    function closeProjectModal() {
    if (!projectModal) return;
    document.removeEventListener("keydown", projectModal.onKey);
    projectModal.wrapper.remove();
    projectModal = null;
    unlockProjectModalScroll();
    }

    function lockProjectModalScroll() {
    projectModalScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    document.documentElement.classList.add("lightbox-open");
    document.body.classList.add("lightbox-open");
    }

    function unlockProjectModalScroll() {
    document.documentElement.classList.remove("lightbox-open");
    document.body.classList.remove("lightbox-open");
    window.scrollTo(0, projectModalScrollY);
    }

    function showProjectModal(index) {
    currentProjectIndex = index;
    if (projectModal) {
    updateProjectModal();
    return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "modal-wrapper";
    wrapper.setAttribute("role", "dialog");
    wrapper.setAttribute("aria-modal", "true");
    wrapper.setAttribute("aria-label", "项目图片预览");
    wrapper.tabIndex = -1;

    const stage = document.createElement("div");
    stage.className = "modal-stage";

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";

    const modal = document.createElement("div");
    modal.className = "modal-content";
    modal.innerHTML = `
    <button class="modal-close" type="button" title="关闭" aria-label="关闭预览">✕</button>
    <button class="modal-nav modal-prev" type="button" title="上一个项目" aria-label="上一个项目">‹</button>
    <div class="modal-media">
    <img class="modal-image" src="" alt="">
    <div class="modal-loading" aria-hidden="true"></div>
    </div>
    <button class="modal-nav modal-next" type="button" title="下一个项目" aria-label="下一个项目">›</button>
    <div class="modal-body">
    <div class="modal-count"></div>
    <h2 class="modal-title"></h2>
    <div class="modal-tags"></div>
    <div class="modal-desc"></div>
    <div class="modal-meta"></div>
    </div>
    `;

    stage.appendChild(backdrop);
    stage.appendChild(modal);
    wrapper.appendChild(stage);
    lockProjectModalScroll();
    document.body.appendChild(wrapper);

    function onKey(e) {
    if (e.key === "Escape") closeProjectModal();
    if (e.key === "ArrowLeft") showPrevProject();
    if (e.key === "ArrowRight") showNextProject();
    }

    projectModal = {
    wrapper,
    modal,
    image: modal.querySelector(".modal-image"),
    title: modal.querySelector(".modal-title"),
    tags: modal.querySelector(".modal-tags"),
    description: modal.querySelector(".modal-desc"),
    meta: modal.querySelector(".modal-meta"),
    count: modal.querySelector(".modal-count"),
    prev: modal.querySelector(".modal-prev"),
    next: modal.querySelector(".modal-next"),
    onKey,
    };

    modal.querySelector(".modal-close").addEventListener("click", closeProjectModal);
    projectModal.prev.addEventListener("click", showPrevProject);
    projectModal.next.addEventListener("click", showNextProject);
    backdrop.addEventListener("click", closeProjectModal);
    document.addEventListener("keydown", onKey);
    updateProjectModal();
    }

    function updateProjectModal() {
    if (!projectModal) return;
    const list = getProjectList();
    const project = list[currentProjectIndex];
    if (!project) return;

    projectModal.wrapper.classList.add("is-loading");
    projectModal.image.onload = () => projectModal.wrapper.classList.remove("is-loading");
    projectModal.image.onerror = () => {
    projectModal.wrapper.classList.remove("is-loading");
    projectModal.image.onerror = null;
    projectModal.image.src = "./images/logo.png";
    };
    projectModal.image.src = project.image;
    projectModal.image.alt = project.name;
    projectModal.title.textContent = project.name;
    projectModal.tags.innerHTML = `
    <span class="ptag">${escapeHtml(project.dimension)}</span>
    <span class="ptag">${escapeHtml(project.type)}</span>
    `;
    projectModal.description.innerHTML = formatDescription(project.description) || "暂无描述喵";
    projectModal.meta.textContent = `建造者：${project.author}`;
    projectModal.count.textContent = `${currentProjectIndex + 1} / ${list.length}`;
    projectModal.prev.disabled = list.length <= 1;
    projectModal.next.disabled = list.length <= 1;

    [
    (currentProjectIndex - 1 + list.length) % list.length,
    (currentProjectIndex + 1) % list.length,
    ].forEach((neighborIndex) => {
    if (!list[neighborIndex]) return;
    const preload = new Image();
    preload.src = list[neighborIndex].image;
    });
    }

    function showPrevProject() {
    const list = getProjectList();
    currentProjectIndex = (currentProjectIndex - 1 + list.length) % list.length;
    updateProjectModal();
    }

    function showNextProject() {
    const list = getProjectList();
    currentProjectIndex = (currentProjectIndex + 1) % list.length;
    updateProjectModal();
    }

    function startDownload(url, fileName) {
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName || "";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    }

    function renderProjectionFiles() {
    const list = document.getElementById("projectionList");
    if (!list) return;

    if (!PROJECTION_FILES.length) {
    list.innerHTML = '<div class="projection-empty">暂无可下载投影文件</div>';
    return;
    }

    list.innerHTML = PROJECTION_FILES.map(file => `
    <button class="projection-item" type="button"
    data-url="${file.url}"
    data-name="${file.name}">
    <div class="name">${file.name}</div>
    <div class="meta">${file.note || "点击下载"}</div>
    </button>
    `).join("");

    list.querySelectorAll(".projection-item").forEach(link => {
    link.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    startDownload(link.dataset.url, link.dataset.name);
    });
    });
    }

    function initProjectionPanel() {
    const panel = document.getElementById("projectionPanel");
    const toggle = document.getElementById("projectionToggle");
    if (!panel || !toggle) return;

    toggle.addEventListener("click", () => {
    panel.classList.toggle("collapsed");
    });

    renderProjectionFiles();
    }

    renderProjects();
    initProjectionPanel();
</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/animations.js?v=local-gsap-polish"></script>
</body>
