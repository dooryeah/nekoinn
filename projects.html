<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程项目 - 喵宿咖啡厅</title>
    <link rel="icon" type="image/png" href="./images/logo.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="js/theme-init.js?v=20260618-local-opt"></script>
    <link rel="stylesheet" href="css/animations.css?v=20260618-local-opt">
    <link rel="stylesheet" href="css/main.css?v=20260819-fix">
</head>
<body class="projects-page">

    <header class="navbar">
        <img src="./images/logo.png" alt="喵宿 Logo" width="92" height="50">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html">服务器展览</a>
            <a href="projects.html" aria-current="page">工程项目</a>
            <a href="members.html">个人</a>
            <a href="about.html">关于</a>
        </div>
    </header>

    <div class="content">
        <div class="card fade-up compact-hero-card project-hero-card">
            <div class="compact-hero-copy">
                <p class="section-kicker">Projects</p>
                <h1>工程项目</h1>
                <p class="section-note">服务器中各位玩家的工程与建筑作品展示，可以按维度、类型或关键词快速找到想看的项目。</p>
            </div>
            <div class="project-hero-mascot">
                <img class="project-hero-gif" src="./images/luobozi.gif" alt="" width="142" height="112" loading="lazy" decoding="async">
                <span class="project-hero-caption">私は、高性能ですから!</span>
            </div>
        </div>

        <div class="card project-list-card">
            <div class="projects-toolbar">
                <label class="search-field" for="projectSearch">
                    搜索项目
                    <input id="projectSearch" type="search" placeholder="输入名称、作者或关键词">
                </label>
                <div id="projectCount" class="project-count">全部项目</div>
            </div>
            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-group-label">维度</span>
                    <span class="filter-tag active" data-group="dimension" data-value="all">全部</span>
                    <span class="filter-tag" data-group="dimension" data-value="主世界">主世界</span>
                    <span class="filter-tag" data-group="dimension" data-value="地狱">地狱</span>
                    <span class="filter-tag" data-group="dimension" data-value="末地">末地</span>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">类型</span>
                    <span class="filter-tag active" data-group="type" data-value="all">全部</span>
                    <span class="filter-tag" data-group="type" data-value="机器">机器</span>
                    <span class="filter-tag" data-group="type" data-value="建筑">建筑</span>
                </div>
            </div>
            <div id="projectGrid" class="project-grid"></div>
        </div>
    </div>

    <div id="projectionPanel" class="projection-panel collapsed">
        <button id="projectionToggle" class="projection-header" type="button">
            <span>投影</span>
            <span class="projection-arrow">▼</span>
        </button>
        <div class="projection-body">
            <div id="projectionList" class="projection-list"></div>
        </div>
    </div>
    <script src="js/supabase-config.js?v=20260819-admin"></script>
    <script src="data/projects.js?v=20260618-local-opt"></script>
    <script>
        let PROJECTS = window.NEKOINN_PROJECTS || [];
        let PROJECTION_FILES = window.NEKOINN_PROJECTION_FILES || [];

        const filters = { dimension: "all", type: "all", query: "" };
            let filteredProjects = PROJECTS.slice();
            let projectModal = null;
            let currentProjectIndex = 0;
            let projectModalScrollY = 0;

    function toPlainText(text) {
    return String(text || "")
    .replace(/<br\s*\/?>/gi, " ")
    .replace(/<[^>]*>/g, "")
    .replace(/\s+/g, " ")
    .trim();
    }

    function escapeHtml(value) {
    return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
    }

    function formatDescription(text) {
    return String(text || "")
    .split(/<br\s*\/?>/gi)
    .map(part => escapeHtml(part.trim()))
    .filter(Boolean)
    .join("<br>");
    }

    function getProjectList() {
    return filteredProjects.length ? filteredProjects : PROJECTS;
    }

    function renderProjects() {
    const grid = document.getElementById("projectGrid");
    const count = document.getElementById("projectCount");
    if (!grid) return;
    if (window.NekoinnMotion) window.NekoinnMotion.cleanupRevealTargets(grid);
    grid.innerHTML = "";

    filteredProjects = PROJECTS.filter(p => {
    const dimOk = filters.dimension === "all" || p.dimension === filters.dimension;
    const typeOk = filters.type === "all" || p.type === filters.type;
    const haystack = [p.name, p.author, p.dimension, p.type, toPlainText(p.description)].join(" ").toLowerCase();
    const queryOk = !filters.query || haystack.includes(filters.query);
    return dimOk && typeOk && queryOk;
    });

    if (count) {
    count.textContent = `显示 ${filteredProjects.length} / ${PROJECTS.length} 个项目`;
    }

    if (filteredProjects.length === 0) {
    grid.innerHTML = '<div class="no-result">暂无匹配的项目 🐱</div>';
    requestAnimationFrame(() => {
    if (window.NekoinnMotion) window.NekoinnMotion.refresh();
    else if (window.ScrollTrigger) ScrollTrigger.refresh();
    });
    return;
    }

    filteredProjects.forEach((project, index) => {
    const card = document.createElement("button");
    card.className = "project-card fade-up";
    card.type = "button";
    card.addEventListener("click", () => showProjectModal(index));

    card.innerHTML = `
    <span class="project-image-wrap">
    <img src="${escapeHtml(project.image)}" alt="${escapeHtml(project.name)}" width="640" height="400" loading="lazy" decoding="async" onerror="this.src='./images/logo.png'">
    <span class="project-zoom-label">查看大图</span>
    </span>
    <div class="project-info">
    <div class="project-name">${escapeHtml(project.name)}</div>
    <p class="project-author">建造者：${escapeHtml(project.author)}</p>
    <p class="project-desc">${escapeHtml(toPlainText(project.description) || "暂无描述喵")}</p>
    <div class="project-tags">
    <span class="ptag">${escapeHtml(project.dimension)}</span>
    <span class="ptag">${escapeHtml(project.type)}</span>
    </div>
    </div>
    `;
    grid.appendChild(card);
    });

    requestAnimationFrame(() => {
    if (window.NekoinnMotion) window.NekoinnMotion.refresh();
    else if (window.ScrollTrigger) ScrollTrigger.refresh();
    });
    }

    document.querySelectorAll(".filter-tag").forEach(tag => {
    tag.addEventListener("click", () => {
    const group = tag.dataset.group;
    const value = tag.dataset.value;

    document.querySelectorAll(`.filter-tag[data-group="${group}"]`).forEach(t => t.classList.remove("active"));
    tag.classList.add("active");

    filters[group] = value;
    renderProjects();
    });
    });

    const searchInput = document.getElementById("projectSearch");
    if (searchInput) {
    searchInput.addEventListener("input", () => {
    filters.query = searchInput.value.trim().toLowerCase();
    renderProjects();
    });
    }

    function closeProjectModal() {
    if (!projectModal) return;
    document.removeEventListener("keydown", projectModal.onKey);
    projectModal.wrapper.remove();
    projectModal = null;
    unlockProjectModalScroll();
    }

    function lockProjectModalScroll() {
    projectModalScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    document.documentElement.classList.add("lightbox-open");
    document.body.classList.add("lightbox-open");
    }

    function unlockProjectModalScroll() {
    document.documentElement.classList.remove("lightbox-open");
    document.body.classList.remove("lightbox-open");
    window.scrollTo(0, projectModalScrollY);
    }

    function showProjectModal(index) {
    currentProjectIndex = index;
    if (projectModal) {
    updateProjectModal();
    return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "modal-wrapper";
    wrapper.setAttribute("role", "dialog");
    wrapper.setAttribute("aria-modal", "true");
    wrapper.setAttribute("aria-label", "项目图片预览");
    wrapper.tabIndex = -1;

    const stage = document.createElement("div");
    stage.className = "modal-stage";

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";

    const modal = document.createElement("div");
    modal.className = "modal-content";
    modal.innerHTML = `
    <button class="modal-close" type="button" title="关闭" aria-label="关闭预览">✕</button>
    <button class="modal-nav modal-prev" type="button" title="上一个项目" aria-label="上一个项目">‹</button>
    <div class="modal-media">
    <img class="modal-image" src="" alt="">
    <div class="modal-loading" aria-hidden="true"></div>
    </div>
    <button class="modal-nav modal-next" type="button" title="下一个项目" aria-label="下一个项目">›</button>
    <div class="modal-body">
    <div class="modal-count"></div>
    <h2 class="modal-title"></h2>
    <div class="modal-tags"></div>
    <div class="modal-desc"></div>
    <div class="modal-meta"></div>
    </div>
    `;

    stage.appendChild(backdrop);
    stage.appendChild(modal);
    wrapper.appendChild(stage);
    lockProjectModalScroll();
    document.body.appendChild(wrapper);

    function onKey(e) {
    if (e.key === "Escape") closeProjectModal();
    if (e.key === "ArrowLeft") showPrevProject();
    if (e.key === "ArrowRight") showNextProject();
    }

    projectModal = {
    wrapper,
    modal,
    image: modal.querySelector(".modal-image"),
    title: modal.querySelector(".modal-title"),
    tags: modal.querySelector(".modal-tags"),
    description: modal.querySelector(".modal-desc"),
    meta: modal.querySelector(".modal-meta"),
    count: modal.querySelector(".modal-count"),
    prev: modal.querySelector(".modal-prev"),
    next: modal.querySelector(".modal-next"),
    onKey,
    };

    modal.querySelector(".modal-close").addEventListener("click", closeProjectModal);
    projectModal.prev.addEventListener("click", showPrevProject);
    projectModal.next.addEventListener("click", showNextProject);
    backdrop.addEventListener("click", closeProjectModal);
    document.addEventListener("keydown", onKey);
    updateProjectModal();
    }

    function updateProjectModal() {
    if (!projectModal) return;
    const list = getProjectList();
    const project = list[currentProjectIndex];
    if (!project) return;

    projectModal.wrapper.classList.add("is-loading");
    projectModal.image.onload = () => projectModal.wrapper.classList.remove("is-loading");
    projectModal.image.onerror = () => {
    projectModal.wrapper.classList.remove("is-loading");
    projectModal.image.onerror = null;
    projectModal.image.src = "./images/logo.png";
    };
    projectModal.image.src = project.image;
    projectModal.image.alt = project.name;
    projectModal.title.textContent = project.name;
    projectModal.tags.innerHTML = `
    <span class="ptag">${escapeHtml(project.dimension)}</span>
    <span class="ptag">${escapeHtml(project.type)}</span>
    `;
    projectModal.description.innerHTML = formatDescription(project.description) || "暂无描述喵";
    projectModal.meta.textContent = `建造者：${project.author}`;
    projectModal.count.textContent = `${currentProjectIndex + 1} / ${list.length}`;
    projectModal.prev.disabled = list.length <= 1;
    projectModal.next.disabled = list.length <= 1;

    [
    (currentProjectIndex - 1 + list.length) % list.length,
    (currentProjectIndex + 1) % list.length,
    ].forEach((neighborIndex) => {
    if (!list[neighborIndex]) return;
    const preload = new Image();
    preload.src = list[neighborIndex].image;
    });
    }

    function showPrevProject() {
    const list = getProjectList();
    currentProjectIndex = (currentProjectIndex - 1 + list.length) % list.length;
    updateProjectModal();
    }

    function showNextProject() {
    const list = getProjectList();
    currentProjectIndex = (currentProjectIndex + 1) % list.length;
    updateProjectModal();
    }

    function startDownload(url, fileName) {
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName || "";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    }

    function renderProjectionFiles() {
    const list = document.getElementById("projectionList");
    if (!list) return;

    if (!PROJECTION_FILES.length) {
    list.innerHTML = '<div class="projection-empty">暂无可下载投影文件</div>';
    return;
    }

    list.innerHTML = PROJECTION_FILES.map(file => `
    <button class="projection-item" type="button"
    data-url="${file.url}"
    data-name="${file.name}">
    <div class="name">${file.name}</div>
    <div class="meta">${file.note || "点击下载"}</div>
    </button>
    `).join("");

    list.querySelectorAll(".projection-item").forEach(link => {
    link.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    startDownload(link.dataset.url, link.dataset.name);
    });
    });
    }

    function initProjectionPanel() {
    const panel = document.getElementById("projectionPanel");
    const toggle = document.getElementById("projectionToggle");
    if (!panel || !toggle) return;

    toggle.addEventListener("click", () => {
    panel.classList.toggle("collapsed");
    });

    renderProjectionFiles();
    }

    renderProjects();
    initProjectionPanel();

    async function loadRemoteData() {
        const config = window.NEKOINN_SUPABASE || {};
        const url = String(config.url || "").replace(/\/$/, "");
        const anonKey = String(config.anonKey || "");
        if (!url || !anonKey) return;

        const headers = { apikey: anonKey, Authorization: "Bearer " + anonKey };
        try {
            const [projRes, fileRes] = await Promise.all([
                fetch(url + "/rest/v1/projects?select=name,image,dimension,type,author,description&is_active=eq.true&order=sort_order.asc,created_at.asc", { headers }),
                fetch(url + "/rest/v1/projection_files?select=name,url,note&is_active=eq.true&order=sort_order.asc,created_at.asc", { headers }),
            ]);
            if (!projRes.ok || !fileRes.ok) return;
            const remoteProjects = await projRes.json();
            const remoteFiles = await fileRes.json();
            if (Array.isArray(remoteProjects) && remoteProjects.length) {
                PROJECTS = remoteProjects;
            }
            if (Array.isArray(remoteFiles)) {
                PROJECTION_FILES = remoteFiles;
            }
            renderProjects();
            renderProjectionFiles();
        } catch (error) {
            // 拉取失败时保留静态兜底数据
        }
    }

    loadRemoteData();
</script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/animations.js?v=20260618-local-opt"></script>
</body>
</html>
