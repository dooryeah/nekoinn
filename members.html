<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人 - 喵宿咖啡厅</title>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="members-page">
    <div class="navbar">
        <img src="./images/logo.png" alt="Logo">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html">服务器展览</a>
            <a href="projects.html">工程项目</a>
            <a href="members.html" aria-current="page">个人</a>
            <a href="about.html">关于</a>
        </div>
    </div>

    <main class="content personal-shell">
        <section class="card fade-up">
            <p class="section-kicker">Profile</p>
            <h1>个人</h1>
            <p class="section-note">查看基础信息，完成今日签到。</p>
        </section>

        <section id="memberLoading" class="card fade-up member-state">
            <h2>正在检查登录状态...</h2>
        </section>

        <section id="memberSetup" class="card fade-up member-state" hidden>
            <h2>还差一点配置</h2>
            <p>请先填写 <code>js/supabase-config.js</code>，并在 Supabase 执行 <code>supabase/schema.sql</code>。</p>
            <a class="ghost-btn" href="login.html">返回登录</a>
        </section>

        <section id="memberGuest" class="card fade-up member-state" hidden>
            <h2>需要登录</h2>
            <p>登录后才可以检查成员白名单。</p>
            <a class="join-btn" href="login.html">去登录</a>
        </section>

        <section id="memberDenied" class="card fade-up member-state" hidden>
            <h2>暂时不能进入</h2>
            <p><span id="deniedEmail"></span> 不在成员白名单里。</p>
            <div class="auth-actions">
                <a class="ghost-btn" href="index.html">回到主页</a>
                <button class="ghost-btn" type="button" data-sign-out>换个账号</button>
            </div>
        </section>

        <section id="memberContent" class="members-content" hidden>
            <div class="personal-grid">
                <section class="card fade-up personal-card">
                    <div class="member-profile personal-profile">
                        <img id="profileAvatar" class="member-avatar" src="./images/logo.png" alt="成员头像">
                        <div>
                            <p class="section-kicker">Profile</p>
                            <h2 id="profileName">成员</h2>
                            <p id="profileEmail" class="member-muted"></p>
                        </div>
                    </div>

                    <div class="profile-facts">
                        <div class="profile-fact">
                            <span>MC ID</span>
                            <strong id="profileMinecraft">未填写</strong>
                        </div>
                        <div class="profile-fact">
                            <span>身份</span>
                            <strong id="profileRole">member</strong>
                        </div>
                        <div class="profile-fact">
                            <span>邮箱</span>
                            <strong id="profileEmailFact">-</strong>
                        </div>
                    </div>

                    <div class="checkin-box">
                        <button id="checkinButton" class="join-btn" type="button">今日签到</button>
                        <p id="checkinStatus" class="member-muted">正在读取签到状态...</p>
                        <p id="checkinTotal" class="checkin-total">累计签到 0 天</p>
                    </div>

                    <button class="ghost-btn member-signout" type="button" data-sign-out>退出登录</button>
                </section>

                <aside class="card fade-up ranking-card">
                    <p class="section-kicker">Ranking</p>
                    <h2>签到排行榜</h2>
                    <p id="rankingEmpty" class="section-note">还没有签到记录。</p>
                    <div id="rankingList" class="ranking-list"></div>
                </aside>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/members.js?v=20260615-personal-checkin"></script>
    <script src="js/animations.js"></script>
</body>
</html>
