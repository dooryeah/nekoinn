<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器展览 - 喵宿咖啡厅</title>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css?v=20260615-fullscreen-lightbox">
</head>
<body class="exhibition-page">
    <div class="navbar">
        <img src="./images/logo.png" alt="Logo">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html" aria-current="page">服务器展览</a>
            <a href="projects.html">工程项目</a>
            <a href="members.html">个人</a>
            <a href="about.html">关于</a>
        </div>
    </div>

    <div class="content">
        <div class="card fade-up">
            <p class="section-kicker">Gallery</p>
            <h1>服务器展览</h1>
            <p class="section-note">风风光光的喵~ 点击图片可以放大预览，也可以用左右键切换。</p>
        </div>

        <div class="card fade-up">
            <h2>图片列表</h2>
            <div id="gallery" class="gallery"></div>
        </div>
    </div>

    <script>
        const EXHIBITION_IMAGES = [
            "./images/server_1.png",
            "./images/server_2.png",
            "./images/server_3.png",
            "./images/server_4.png",
            "./images/server_5.png",
            "./images/server_6.png",
            "./images/server_7.png",
            "./images/server_8.png",
            "./images/server_9.png",
            "./images/server_10.png",
            "./images/server_11.png",
            "./images/server_12.png",
            "./images/server_13.png",
            "./images/server_14.png",
            "./images/server_15.png",
            "./images/server_16.png",
            "./images/server_17.png",
            "./images/server_18.png",
            "./images/server_19.png",
            "./images/server_20.png",
        ];

        let currentImageIndex = 0;
        let viewer = null;

        function getImageTitle(index) {
            return `服务器展览 ${index + 1}`;
        }

        function preloadNeighborImages() {
            [
                (currentImageIndex - 1 + EXHIBITION_IMAGES.length) % EXHIBITION_IMAGES.length,
                (currentImageIndex + 1) % EXHIBITION_IMAGES.length,
            ].forEach((index) => {
                const preload = new Image();
                preload.src = EXHIBITION_IMAGES[index];
            });
        }

        function closeViewer() {
            if (!viewer) return;
            document.removeEventListener("keydown", viewer.onKey);
            document.body.classList.remove("lightbox-open");
            viewer.backdrop.remove();
            viewer = null;
        }

        function showViewer(index) {
            currentImageIndex = index;
            if (viewer) {
                updateViewer();
                return;
            }

            const backdrop = document.createElement("div");
            backdrop.className = "viewer-backdrop";
            backdrop.setAttribute("role", "dialog");
            backdrop.setAttribute("aria-modal", "true");

            const closeBtn = document.createElement("button");
            closeBtn.className = "viewer-close";
            closeBtn.type = "button";
            closeBtn.title = "关闭";
            closeBtn.setAttribute("aria-label", "关闭预览");
            closeBtn.textContent = "×";

            const prevBtn = document.createElement("button");
            prevBtn.className = "viewer-nav viewer-prev";
            prevBtn.type = "button";
            prevBtn.title = "上一张";
            prevBtn.setAttribute("aria-label", "上一张");
            prevBtn.textContent = "‹";

            const img = document.createElement("img");
            img.className = "viewer-image";
            img.alt = "";

            const loading = document.createElement("div");
            loading.className = "viewer-loading";
            loading.setAttribute("aria-hidden", "true");

            const nextBtn = document.createElement("button");
            nextBtn.className = "viewer-nav viewer-next";
            nextBtn.type = "button";
            nextBtn.title = "下一张";
            nextBtn.setAttribute("aria-label", "下一张");
            nextBtn.textContent = "›";

            const meta = document.createElement("div");
            meta.className = "viewer-meta";

            const title = document.createElement("div");
            title.className = "viewer-title";

            const counter = document.createElement("div");
            counter.className = "viewer-counter";

            meta.appendChild(title);
            meta.appendChild(counter);
            backdrop.appendChild(closeBtn);
            backdrop.appendChild(prevBtn);
            backdrop.appendChild(img);
            backdrop.appendChild(loading);
            backdrop.appendChild(nextBtn);
            backdrop.appendChild(meta);
            document.body.appendChild(backdrop);
            document.body.classList.add("lightbox-open");

            const onClick = (e) => {
                if (e.target === backdrop) closeViewer();
            };
            const onKey = (e) => {
                if (e.key === "Escape") closeViewer();
                if (e.key === "ArrowLeft") showPrevImage();
                if (e.key === "ArrowRight") showNextImage();
            };

            viewer = { backdrop, img, title, counter, onKey };
            closeBtn.addEventListener("click", closeViewer);
            prevBtn.addEventListener("click", showPrevImage);
            nextBtn.addEventListener("click", showNextImage);
            backdrop.addEventListener("click", onClick);
            document.addEventListener("keydown", onKey);
            updateViewer();
            closeBtn.focus();
        }

        function updateViewer() {
            if (!viewer) return;
            const src = EXHIBITION_IMAGES[currentImageIndex];
            const title = getImageTitle(currentImageIndex);
            viewer.backdrop.classList.add("is-loading");
            viewer.img.onload = () => viewer.backdrop.classList.remove("is-loading");
            viewer.img.onerror = () => {
                viewer.backdrop.classList.remove("is-loading");
                viewer.img.onerror = null;
                viewer.img.src = "./images/logo.png";
            };
            viewer.img.src = src;
            viewer.img.alt = title;
            viewer.title.textContent = title;
            viewer.counter.textContent = `${currentImageIndex + 1} / ${EXHIBITION_IMAGES.length}`;
            preloadNeighborImages();
        }

        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + EXHIBITION_IMAGES.length) % EXHIBITION_IMAGES.length;
            updateViewer();
        }

        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % EXHIBITION_IMAGES.length;
            updateViewer();
        }

        function render(arr) {
            const gallery = document.getElementById("gallery");
            if (!gallery) return;
            gallery.innerHTML = "";
            arr.forEach((src, index) => {
                const button = document.createElement("button");
                button.className = "thumb";
                button.type = "button";
                button.setAttribute("aria-label", `放大${getImageTitle(index)}`);
                const img = document.createElement("img");
                img.src = src;
                img.alt = getImageTitle(index);
                img.loading = "lazy";
                button.addEventListener("click", () => showViewer(index));
                button.appendChild(img);
                gallery.appendChild(button);
            });
        }

        render(EXHIBITION_IMAGES);
    </script>
    <script src="js/animations.js"></script>
</body>
</html>
