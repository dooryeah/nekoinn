<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器展览 - 喵宿咖啡厅</title>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css?v=20260615-hidden-fix">
</head>
<body class="exhibition-page">
    <div class="navbar">
        <img src="./images/logo.png" alt="Logo">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html" aria-current="page">服务器展览</a>
            <a href="projects.html">工程项目</a>
            <a href="members.html">个人</a>
            <a href="about.html">关于</a>
        </div>
    </div>

    <div class="content">
        <div class="card fade-up">
            <p class="section-kicker">Gallery</p>
            <h1>服务器展览</h1>
            <p class="section-note">风风光光的喵~ 点击图片可以放大预览，也可以用左右键切换。</p>
        </div>

        <div class="card fade-up">
            <h2>图片列表</h2>
            <div id="gallery" class="gallery"></div>
        </div>
    </div>

    <script>
        const EXHIBITION_IMAGES = [
            "./images/server_1.png",
            "./images/server_2.png",
            "./images/server_3.png",
            "./images/server_4.png",
            "./images/server_5.png",
            "./images/server_6.png",
            "./images/server_7.png",
            "./images/server_8.png",
            "./images/server_9.png",
            "./images/server_10.png",
            "./images/server_11.png",
            "./images/server_12.png",
            "./images/server_13.png",
            "./images/server_14.png",
            "./images/server_15.png",
            "./images/server_16.png",
            "./images/server_17.png",
            "./images/server_18.png",
            "./images/server_19.png",
            "./images/server_20.png",
        ];

        let currentImageIndex = 0;
        let viewer = null;

        function showViewer(index) {
            currentImageIndex = index;
            const backdrop = document.createElement("div");
            backdrop.className = "viewer-backdrop";

            const closeBtn = document.createElement("button");
            closeBtn.className = "viewer-close";
            closeBtn.type = "button";
            closeBtn.title = "关闭";
            closeBtn.textContent = "×";

            const prevBtn = document.createElement("button");
            prevBtn.className = "viewer-nav viewer-prev";
            prevBtn.type = "button";
            prevBtn.title = "上一张";
            prevBtn.textContent = "‹";

            const img = document.createElement("img");
            img.className = "viewer-image";
            img.alt = "服务器展览图片";

            const nextBtn = document.createElement("button");
            nextBtn.className = "viewer-nav viewer-next";
            nextBtn.type = "button";
            nextBtn.title = "下一张";
            nextBtn.textContent = "›";

            const counter = document.createElement("div");
            counter.className = "viewer-counter";

            backdrop.appendChild(closeBtn);
            backdrop.appendChild(prevBtn);
            backdrop.appendChild(img);
            backdrop.appendChild(nextBtn);
            backdrop.appendChild(counter);
            document.body.appendChild(backdrop);

            viewer = { backdrop, img, counter };
            updateViewer();

            function closeViewer() {
                document.removeEventListener("keydown", onKey);
                backdrop.removeEventListener("click", onClick);
                backdrop.remove();
                viewer = null;
            }
            function onClick(e) {
                if (e.target === backdrop) closeViewer();
            }
            function onKey(e) {
                if (e.key === "Escape") closeViewer();
                if (e.key === "ArrowLeft") showPrevImage();
                if (e.key === "ArrowRight") showNextImage();
            }

            closeBtn.addEventListener("click", closeViewer);
            prevBtn.addEventListener("click", showPrevImage);
            nextBtn.addEventListener("click", showNextImage);
            backdrop.addEventListener("click", onClick);
            document.addEventListener("keydown", onKey);
        }

        function updateViewer() {
            if (!viewer) return;
            viewer.img.src = EXHIBITION_IMAGES[currentImageIndex];
            viewer.counter.textContent = `${currentImageIndex + 1} / ${EXHIBITION_IMAGES.length}`;
        }

        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + EXHIBITION_IMAGES.length) % EXHIBITION_IMAGES.length;
            updateViewer();
        }

        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % EXHIBITION_IMAGES.length;
            updateViewer();
        }

        function render(arr) {
            const gallery = document.getElementById("gallery");
            if (!gallery) return;
            gallery.innerHTML = "";
            arr.forEach((src, index) => {
                const div = document.createElement("div");
                div.className = "thumb";
                div.tabIndex = 0;
                const img = document.createElement("img");
                img.src = src;
                img.alt = "server image";
                img.loading = "lazy";
                div.addEventListener("click", () => showViewer(index));
                div.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        showViewer(index);
                    }
                });
                div.appendChild(img);
                gallery.appendChild(div);
            });
        }

        render(EXHIBITION_IMAGES);
    </script>
    <script src="js/animations.js"></script>
</body>
</html>
