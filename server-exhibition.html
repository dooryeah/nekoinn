<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器展览 - 喵宿咖啡厅</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="js/theme-init.js?v=20260618-local-opt"></script>
    <link rel="stylesheet" href="css/animations.css?v=20260618-local-opt">
    <link rel="stylesheet" href="css/main.css?v=20260618-local-opt">
</head>
<body class="exhibition-page">
    <div class="navbar">
        <img src="./images/logo.png" alt="Logo">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html" aria-current="page">服务器展览</a>
            <a href="projects.html">工程项目</a>
            <a href="members.html">个人</a>
            <a href="about.html">关于</a>
        </div>
    </div>

    <div class="content">
        <div class="card fade-up compact-hero-card">
            <p class="section-kicker">Gallery</p>
            <h1>服务器展览</h1>
            <p class="section-note">风风光光的喵~ 点击图片可以放大预览，也可以用左右键切换。</p>
        </div>

        <div class="card fade-up">
            <h2>图片列表</h2>
            <div id="gallery" class="gallery"></div>
        </div>
    </div>

    <script src="js/supabase-config.js?v=20260819-admin"></script>
    <script>
        const FALLBACK_EXHIBITION_ITEMS = [
            { image: "./images/server_1.png", title: "", description: "" },
            { image: "./images/server_2.png", title: "", description: "" },
            { image: "./images/server_3.png", title: "", description: "" },
            { image: "./images/server_4.png", title: "", description: "" },
            { image: "./images/server_5.png", title: "", description: "" },
            { image: "./images/server_6.png", title: "", description: "" },
            { image: "./images/server_7.png", title: "", description: "" },
            { image: "./images/server_8.png", title: "", description: "" },
            { image: "./images/server_9.png", title: "", description: "" },
            { image: "./images/server_10.png", title: "", description: "" },
            { image: "./images/server_11.png", title: "", description: "" },
            { image: "./images/server_12.png", title: "", description: "" },
            { image: "./images/server_13.png", title: "", description: "" },
            { image: "./images/server_14.png", title: "", description: "" },
            { image: "./images/server_15.png", title: "", description: "" },
            { image: "./images/server_16.png", title: "", description: "" },
            { image: "./images/server_17.png", title: "", description: "" },
            { image: "./images/server_18.png", title: "", description: "" },
            { image: "./images/server_19.png", title: "", description: "" },
            { image: "./images/server_20.png", title: "", description: "" },
        ];

        let EXHIBITION_ITEMS = FALLBACK_EXHIBITION_ITEMS;
        let currentImageIndex = 0;
        let viewer = null;

        function getImageTitle(index) {
            const item = EXHIBITION_ITEMS[index];
            return item && item.title ? item.title : `服务器展览 ${index + 1}`;
        }

        function getImageDescription(index) {
            const item = EXHIBITION_ITEMS[index];
            return item && item.description ? item.description : "";
        }

        function preloadNeighborImages() {
            [
                (currentImageIndex - 1 + EXHIBITION_ITEMS.length) % EXHIBITION_ITEMS.length,
                (currentImageIndex + 1) % EXHIBITION_ITEMS.length,
            ].forEach((index) => {
                const item = EXHIBITION_ITEMS[index];
                if (!item) return;
                const preload = new Image();
                preload.src = item.image;
            });
        }

        function closeViewer() {
            if (!viewer) return;
            document.removeEventListener("keydown", viewer.onKey);
            document.body.classList.remove("lightbox-open");
            viewer.backdrop.remove();
            viewer = null;
        }

        function showViewer(index) {
            currentImageIndex = index;
            if (viewer) {
                updateViewer();
                return;
            }

            const backdrop = document.createElement("div");
            backdrop.className = "viewer-backdrop";
            backdrop.setAttribute("role", "dialog");
            backdrop.setAttribute("aria-modal", "true");

            const closeBtn = document.createElement("button");
            closeBtn.className = "viewer-close";
            closeBtn.type = "button";
            closeBtn.title = "关闭";
            closeBtn.setAttribute("aria-label", "关闭预览");
            closeBtn.textContent = "×";

            const prevBtn = document.createElement("button");
            prevBtn.className = "viewer-nav viewer-prev";
            prevBtn.type = "button";
            prevBtn.title = "上一张";
            prevBtn.setAttribute("aria-label", "上一张");
            prevBtn.textContent = "‹";

            const img = document.createElement("img");
            img.className = "viewer-image";
            img.alt = "";

            const loading = document.createElement("div");
            loading.className = "viewer-loading";
            loading.setAttribute("aria-hidden", "true");

            const nextBtn = document.createElement("button");
            nextBtn.className = "viewer-nav viewer-next";
            nextBtn.type = "button";
            nextBtn.title = "下一张";
            nextBtn.setAttribute("aria-label", "下一张");
            nextBtn.textContent = "›";

            const meta = document.createElement("div");
            meta.className = "viewer-meta";

            const title = document.createElement("div");
            title.className = "viewer-title";

            const desc = document.createElement("div");
            desc.className = "viewer-desc";

            const counter = document.createElement("div");
            counter.className = "viewer-counter";

            meta.appendChild(title);
            meta.appendChild(desc);
            meta.appendChild(counter);
            backdrop.appendChild(closeBtn);
            backdrop.appendChild(prevBtn);
            backdrop.appendChild(img);
            backdrop.appendChild(loading);
            backdrop.appendChild(nextBtn);
            backdrop.appendChild(meta);
            document.body.appendChild(backdrop);
            document.body.classList.add("lightbox-open");

            const onClick = (e) => {
                if (e.target === backdrop) closeViewer();
            };
            const onKey = (e) => {
                if (e.key === "Escape") closeViewer();
                if (e.key === "ArrowLeft") showPrevImage();
                if (e.key === "ArrowRight") showNextImage();
            };

            viewer = { backdrop, img, title, desc, counter, onKey };
            closeBtn.addEventListener("click", closeViewer);
            prevBtn.addEventListener("click", showPrevImage);
            nextBtn.addEventListener("click", showNextImage);
            backdrop.addEventListener("click", onClick);
            document.addEventListener("keydown", onKey);
            updateViewer();
        }

        function updateViewer() {
            if (!viewer) return;
            const item = EXHIBITION_ITEMS[currentImageIndex];
            const src = item ? item.image : "./images/logo.png";
            const title = getImageTitle(currentImageIndex);
            const desc = getImageDescription(currentImageIndex);
            viewer.backdrop.classList.add("is-loading");
            viewer.img.onload = () => viewer.backdrop.classList.remove("is-loading");
            viewer.img.onerror = () => {
                viewer.backdrop.classList.remove("is-loading");
                viewer.img.onerror = null;
                viewer.img.src = "./images/logo.png";
            };
            viewer.img.src = src;
            viewer.img.alt = title;
            viewer.title.textContent = title;
            viewer.desc.textContent = desc;
            viewer.desc.hidden = !desc;
            viewer.counter.textContent = `${currentImageIndex + 1} / ${EXHIBITION_ITEMS.length}`;
            preloadNeighborImages();
        }

        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + EXHIBITION_ITEMS.length) % EXHIBITION_ITEMS.length;
            updateViewer();
        }

        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % EXHIBITION_ITEMS.length;
            updateViewer();
        }

        function render(arr) {
            const gallery = document.getElementById("gallery");
            if (!gallery) return;
            gallery.innerHTML = "";
            arr.forEach((item, index) => {
                const button = document.createElement("button");
                button.className = "thumb";
                button.type = "button";
                button.setAttribute("aria-label", `放大${getImageTitle(index)}`);
                const img = document.createElement("img");
                img.src = item.image;
                img.alt = getImageTitle(index);
                img.loading = "lazy";
                button.addEventListener("click", () => showViewer(index));
                button.appendChild(img);
                gallery.appendChild(button);
            });
        }

        async function loadRemoteData() {
            const config = window.NEKOINN_SUPABASE || {};
            const url = String(config.url || "").replace(/\/$/, "");
            const anonKey = String(config.anonKey || "");
            if (!url || !anonKey) return;

            const headers = { apikey: anonKey, Authorization: "Bearer " + anonKey };
            try {
                const response = await fetch(
                    url + "/rest/v1/exhibition_items?select=image,title,description&is_active=eq.true&order=sort_order.asc,created_at.asc",
                    { headers }
                );
                if (!response.ok) return;
                const remote = await response.json();
                if (Array.isArray(remote) && remote.length) {
                    EXHIBITION_ITEMS = remote;
                    render(EXHIBITION_ITEMS);
                }
            } catch (error) {
                // 拉取失败时保留静态兜底数据
            }
        }

        render(EXHIBITION_ITEMS);
        loadRemoteData();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/animations.js?v=20260618-local-opt"></script>
</body>
</html>
