<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成员登录 - 喵宿咖啡厅</title>
    <script src="js/theme-init.js?v=local-gsap-polish"></script>
    <link rel="stylesheet" href="css/animations.css?v=local-gsap-polish">
    <link rel="stylesheet" href="css/main.css?v=local-gsap-polish">
</head>
<body class="auth-page">
    <div class="navbar">
        <img src="./images/logo.png" alt="Logo">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html">服务器展览</a>
            <a href="projects.html">工程项目</a>
            <a href="members.html">个人</a>
            <a href="about.html">关于</a>
        </div>
    </div>

    <div class="content auth-layout">
        <section class="card fade-up auth-card">
            <p class="section-kicker">Member Login</p>
            <h1>成员登录</h1>
            <p class="section-note">输入白名单邮箱，收到验证码后在这里完成登录。</p>

            <form id="emailForm" class="auth-form">
                <label for="loginEmail">邮箱</label>
                <input id="loginEmail" type="email" name="email" autocomplete="email" placeholder="name@example.com" required>
                <button id="sendCodeSubmit" class="join-btn" type="submit">发送验证码</button>
            </form>

            <form id="codeForm" class="auth-form auth-code-form" hidden>
                <div class="auth-code-target" id="codeTarget"></div>
                <label for="loginCode">验证码</label>
                <input id="loginCode" class="auth-code-input" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="输入 8 位验证码" required>
                <button id="verifyCodeSubmit" class="join-btn" type="submit">验证并登录</button>
                <div class="auth-actions">
                    <button id="resendCode" class="ghost-btn" type="button">重新发送</button>
                    <button id="changeEmail" class="ghost-btn" type="button">换个邮箱</button>
                </div>
            </form>

            <div id="loginStatus" class="auth-status" role="status" aria-live="polite"></div>
        </section>

        <aside id="sessionBox" class="card fade-up auth-side" hidden>
            <h2>当前账号</h2>
            <p id="sessionText"></p>
            <div class="auth-actions">
                <a class="join-btn" href="members.html">进入个人</a>
                <button id="loginSignOut" class="ghost-btn" type="button">退出登录</button>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js?v=20260615-public-profile"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/animations.js?v=local-gsap-polish"></script>
</body>
</html>
