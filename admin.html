<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>内容管理 - 喵宿咖啡厅</title>
    <link rel="icon" type="image/png" href="./images/logo.png">
    <script src="js/theme-init.js?v=20260819-admin"></script>
    <link rel="stylesheet" href="css/animations.css?v=20260819-admin">
    <link rel="stylesheet" href="css/main.css?v=20260819-admin">
    <link rel="stylesheet" href="css/admin.css?v=20260819-admin">
</head>
<body class="admin-page">

    <main id="adminLogin" class="admin-login" hidden>
        <div class="card auth-card">
            <p class="section-kicker">Admin</p>
            <h1>内容管理</h1>
            <p class="admin-login-hint">需要管理员密码喵～</p>
            <form id="adminLoginForm" class="auth-form" autocomplete="off">
                <label for="adminPassword">密码</label>
                <input id="adminPassword" type="password" autocomplete="current-password" required>
                <div class="auth-actions">
                    <button class="join-btn" type="submit" id="adminLoginButton">登录</button>
                </div>
            </form>
            <p id="adminLoginStatus" class="auth-status" role="status" aria-live="polite"></p>
        </div>
    </main>

    <main id="adminPanel" class="admin-panel" hidden>
        <header class="admin-header">
            <div class="admin-header-title">
                <p class="section-kicker">Admin</p>
                <h1>内容管理</h1>
            </div>
            <button class="ghost-btn" id="adminLogout" type="button">退出登录</button>
        </header>

        <div class="admin-tabs" role="tablist" aria-label="内容分类">
            <button class="admin-tab is-active" type="button" role="tab" data-entity="projects" aria-selected="true">工程项目</button>
            <button class="admin-tab" type="button" role="tab" data-entity="exhibition" aria-selected="false">服务器展览</button>
            <button class="admin-tab" type="button" role="tab" data-entity="projection" aria-selected="false">投影文件</button>
        </div>

        <div class="admin-toolbar">
            <button class="join-btn" id="adminAdd" type="button">新增条目</button>
            <span id="adminCount" class="admin-count"></span>
        </div>

        <div id="adminList" class="admin-list"></div>
    </main>

    <div id="adminModal" class="admin-modal" hidden aria-hidden="true"></div>
    <div id="adminToast" class="copy-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=20260819-admin"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/animations.js?v=20260819-admin"></script>
    <script src="js/admin.js?v=20260819-admin"></script>
</body>
</html>
