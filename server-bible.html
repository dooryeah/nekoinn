<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器圣经 - 喵宿咖啡厅</title>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bible-page">
    <div class="navbar">
        <img src="./images/logo.png" alt="Logo">
        <div class="nav-links">
            <a href="index.html">主页</a>
            <a href="server-exhibition.html">服务器展览</a>
            <a href="projects.html">工程项目</a>
            <a href="members.html">个人</a>
            <a href="about.html">关于</a>
        </div>
    </div>

    <div class="content">
        <div class="card fade-up">
            <p class="section-kicker">Bible</p>
            <h1>服务器圣经</h1>
        </div>
        <div id="gallery" class="gallery"></div>
    </div>

    <!-- 音乐播放器 -->
    <div class="music-player">
        <div class="music-panel" id="musicPanel">
            <h3>🎵 歌曲列表</h3>
            <ul class="song-list" id="songList"></ul>
            <div class="now-playing" id="nowPlaying">未播放</div>
        </div>
        <button class="music-btn" id="musicBtn" title="音乐播放器">♪</button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ========== 在此添加歌曲 ==========
        const SONGS = [
            { name: 'にび (feat. 初音ミク)   初音ミク/monoton', src: 'music/song1.mp3' },
            { name:'Start To The End   Xeudo Code/LucaProject', src: 'music/song2.mp3' },
            { name:'花たちに希望を   Sound piercer/DAZBEE', src: 'music/song3.mp3' },
            { name:'LEMON MELON COOKIE   TAK初音ミク', src: 'music/song4.mp3' },
            { name:'Lilly   MIMI', src: 'music/song5.mp3' },
            { name:'Consolida   WuyangP', src: 'music/song6.mp3' },

            // 继续添加更多歌曲...
        ];
        // ==================================

        const audioPlayer = document.getElementById('audioPlayer');
        const musicBtn = document.getElementById('musicBtn');
        const musicPanel = document.getElementById('musicPanel');
        const songList = document.getElementById('songList');
        const nowPlaying = document.getElementById('nowPlaying');

        let currentIndex = 0;
        let isPlaying = false;

        // 渲染歌曲列表
        function renderSongList() {
            songList.innerHTML = '';
            SONGS.forEach((song, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="icon">♪</span> ${song.name}`;
                li.onclick = () => playSong(index);
                if (index === currentIndex && isPlaying) {
                    li.classList.add('active');
                }
                songList.appendChild(li);
            });
        }

        // 播放指定歌曲
        function playSong(index) {
            if (SONGS.length === 0) return;
            currentIndex = index;
            audioPlayer.src = SONGS[index].src;
            audioPlayer.play();
            isPlaying = true;
            updateUI();
        }

        // 切换播放/暂停
        function togglePlay() {
            if (SONGS.length === 0) return;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                if (!audioPlayer.src) {
                    playSong(0);
                } else {
                    audioPlayer.play();
                    isPlaying = true;
                }
            }
            updateUI();
        }

        // 更新界面
        function updateUI() {
            musicBtn.textContent = isPlaying ? '❚❚' : '♪';
            musicBtn.classList.toggle('playing', isPlaying);
            nowPlaying.textContent = isPlaying ? `正在播放: ${SONGS[currentIndex].name}` : '已暂停';
            renderSongList();
        }

        // 歌曲播放结束，自动下一首
        audioPlayer.onended = () => {
            currentIndex = (currentIndex + 1) % SONGS.length;
            playSong(currentIndex);
        };

        // 切换面板显示
        musicBtn.onclick = (e) => {
            if (e.shiftKey || e.ctrlKey) {
                musicPanel.classList.toggle('show');
            } else {
                togglePlay();
            }
        };

        // 右键打开面板
        musicBtn.oncontextmenu = (e) => {
            e.preventDefault();
            musicPanel.classList.toggle('show');
        };

        // 点击外部关闭面板
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.music-player')) {
                musicPanel.classList.remove('show');
            }
        });

        renderSongList();

        // ========== 图片画廊 ==========
        const BIBLE_IMAGES = [
            { src: 'images/bible_1.jpg', caption: '' },
            { src: 'images/bible_2.jpg', caption: '' },
            { src: 'images/bible_3.jpg', caption: '' },

        ];

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            if (!gallery) return;

            BIBLE_IMAGES.forEach(({ src, caption }) => {
                const item = document.createElement('div');
                item.className = 'gallery-item fade-up';

                const img = document.createElement('img');
                img.src = src;
                img.alt = caption || '服务器圣经图片';
                img.loading = 'lazy';

                item.appendChild(img);

                if (caption) {
                    const cap = document.createElement('div');
                    cap.className = 'caption';
                    cap.textContent = caption;
                    item.appendChild(cap);
                }

                gallery.appendChild(item);
            });
        }

        renderGallery();
    </script>
    <script src="js/animations.js"></script>
</body>
</html>
