    <!-- 右下角"?"按钮 -->

    <script>
        const ABOUT_TEXT = `孟乃(mengnai123)很早就想玩一个可以玩非常非常久的存档，之前叫身边的朋友试过，不过总是一开始很热情，到后面就慢慢离开，前段时间，偶然遇见一位与他有类似想法的MC搭子(Akari_desu)（就是我们现在的腐竹），于是一拍即合，想着来建立一个服务器。

        因为这样的存档时间跨度很大，所以只能是原版档，因为mod档难以更新，但原版对大多数人来说非常枯燥

        能一直玩下去的可能性就是把虚拟世界当作另一个现实，一直在里面添砖加瓦也好闲逛挂机也好，慢节奏慢慢肝，或者一起与搭子玩耍社交，基于以上想法开了一个服务器..


        关于服务器：m4开服，26.1.2高版本，群组包含生电及其镜像两个生存服、虚空与平坦两个创造服，均有快捷备份与回滚功能；创造服另有we和axiom等基础建筑mod。服务器存档定期备份上传云端无需担心丢档，可以接受矿透和打印机等轮椅mod，可以接受添加新配方`;

        const ABOUT_LINKS = [
        { name: "mengnai123的B站直播间", url: "https://live.bilibili.com/1883379698" },
        { name: "YuriRina的B站直播间", url: "https://live.bilibili.com/9159035" },
        { name: "Akari的B站账号", url: "https://b23.tv/dY4jnb0" },
        { name: "Dooryeah的小黑盒账号", url: "https://www.xiaoheihe.cn/app/user/profile/89879357" },
        ];

        function renderAbout() {
        const aboutEl = document.getElementById("aboutContent");
        if (aboutEl) aboutEl.textContent = ABOUT_TEXT;
        }

        function renderLinks() {
        const ul = document.getElementById("linkList");
        if (!ul) return;
        ul.innerHTML = "";
        ABOUT_LINKS.forEach(({ name, url }) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = name;
        li.appendChild(a);
        ul.appendChild(li);
        });
        }

        renderAbout();
        renderLinks();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
